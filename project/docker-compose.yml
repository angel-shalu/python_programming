version: "3.8"
services:
  streamlit:
    build: .
    command: streamlit run project/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    environment:
      - OPENAI_API_KEY
  api:
    build: .
    command: uvicorn project.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - OPENAI_API_KEY
